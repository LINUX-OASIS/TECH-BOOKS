one can add configuration files to /etc/default/grub.d in order to influence the generation of /etc/default/grub

Scripts: /etc/default/grub.d/customgrubscript.cfg

The scripts in this directory are read during execution of the update-grub command and their instructions are incorporated into /boot/grub/grub.cfg.  you can automate the editing of kernel parameters by using this.

    -ultimately /boot/grub2/grub.cfg is where the generated configuration is saved for GRUB to use, but it is not meant to be edited by users, so grub configurations are made in /etc/default/grub  and  in /etc/default/grub.d/script.cfg


:::its syntax is as follows:::

GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT <desired kernel parameters to add>"

or
GRUB_CMDLINE_LINUX_DEFAULT="<desired kernel parameters to add>"


 -- example
 GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=off"
 
 or
 GRUB_CMDLINE_LINUX_DEFAULT="mitigations=off"
 
 sudo update-grub
 

:::::to automate this in a bash file:::::

echo 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT <desired-kernel-parameters>"' \
  | sudo tee /etc/default/grub.d/<name-of-custom-script>.cfg
  
or

echo 'GRUB_CMDLINE_LINUX_DEFAULT="<desired-kernel-parameters>"' \
  | sudo tee /etc/default/grub.d/<name-of-custom-script>.cfg
  
 
 OR TO APPEND TO THE FILE
 
 echo 'GRUB_CMDLINE_LINUX_DEFAULT="<desired-kernel-parameters>"' \
  | sudo tee -a /etc/default/grub.d/<name-of-custom-script>.cfg

sudo update-grub


** confirm that changes were applied correctly: cat /proc/cmdline
